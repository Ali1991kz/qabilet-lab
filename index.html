:\n    s += i\nprint(s) # 6", "q": "range(2, 5) қандай мәндерді береді?", "o": ["2, 3, 4", "2, 3, 4, 5", "0, 1, 2, 3, 4", "3, 4, 5"], "a": 0, "e": "Басталу мәні қосылады, соңғы шекара қосылмайды."}, {"id": "c3", "d": "code", "level": "Күрделі", "title": "Қатені табу және тестілеу", "minutes": 12, "text": "Синтаксистік қате кодты іске қоспайды. Логикалық қате код орындалса да, қате нәтиже береді. Күтілетін нәтижесі белгілі тесттерді қолдан.", "example": "Екі санның орташа мәні: (a + b) / 2. a + b / 2 өрнегі алдымен b-ні бөледі.", "q": "a = 4, b = 8. Орташа мәнді дұрыс есептейтін өрнек?", "o": ["a + b / 2", "(a + b) / 2", "a * b / 2", "a / b"], "a": 1, "e": "Жақша қосындының алдымен есептелуін қамтамасыз етеді: 12 / 2 = 6."}, {"id": "r1", "d": "research", "level": "Бастапқы", "title": "Деректерді ұсыну", "minutes": 8, "text": "Компьютер ақпаратты екілік түрде сақтайды. Екілік санның оңнан солға разряд салмақтары: 1, 2, 4, 8, 16…", "example": "1011₂ = 1×8 + 0×4 + 1×2 + 1×1 = 11₁₀.", "q": "110₂ ондық жүйеде нешеге тең?", "o": ["3", "5", "6", "8"], "a": 2, "e": "1×4 + 1×2 + 0×1 = 6."}, {"id": "r2", "d": "research", "level": "Орта", "title": "Алгоритмдерді зерттеп салыстыру", "minutes": 10, "text": "Ғылыми жобаға өлшенетін сұрақ қажет. Алгоритмдерді бірдей деректерде салыстырып, салыстыру санын немесе уақытын өлше. Бірнеше сынақ өткіз.", "example": "Сұрақ: тізім ұзындығы көпіршікпен сұрыптаудағы салыстыру санына қалай әсер етеді? 10, 20, 40 элементті тізімдерде өлше.", "q": "Алгоритм жылдамдығын салыстыруда қай жағдайды тұрақты ұстаған дұрыс?", "o": ["Тек жоба атауын", "Құрылғыны, дерек жиынын және өлшеу тәсілін", "Тізімдерді әр алгоритмге бөлек таңдау", "Нәтижені алдын ала белгілеу"], "a": 1, "e": "Салыстыру әділ болуы үшін ортақ жағдайлар бірдей сақталады."}, {"id": "r3", "d": "research", "level": "Күрделі", "title": "Прототипті тексеру және қорғау", "minutes": 12, "text": "Прототипке талаптар мен тест жағдайларын жаз. Нақты нәтиже мен күтілетін нәтижені салыстыр. Қорға function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('Сақтау мүмкін болмады. Браузердің сақтау рұқсатын тексеріңіз.');return false}}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function latest(){return state.history.at(-1)}
function scores(answers){return Object.fromEntries(tracks.map(t=>[t.id,Math.round(questions.reduce((s,q,i)=>s+(q.d===t.id&&answers[i]===q.a?1:0),0)/3*100)]))}
function recommended(){const r=latest();if(!r)return state.profile.interest||'logic';return tracks.slice().sort((a,b)=>r.scores[b.id]-r.scores[a.id]||(a.id===state.profile.interest?-1:1))[0].id}
function footer(){return '<footer><span>© 2026 QabiletLab · Әр оқушының мүмкіндігін ашамыз</span><span>Прототип · Деректер осы браузерде сақталады</span></footer>'}
function intro(title,desc,tag='ОҚУШЫ КЕҢІСТІГІ'){return `<div class="intro"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><p class="muted sub">${desc}</p></div><span class="badge">Жеке даму жолы</span></div>`}
function go(p){location.hash=p}
function render(){page=location.hash.slice(1)||'home';if(!['home','diagnostic','path','learn','trainers','project','portfolio','teacher'].includes(page))page='home';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=document.querySelector(`nav button[data-page="${page}"]`).textContent.trim();$('#header-name').textContent=state.profile.name||'Жас зерттеуші';$('#header-grade').textContent=state.profile.name?`${state.profile.grade}-сынып оқушысы`:'Өз жолыңды бүгін баста';$('#avatar').textContent=(state.profile.name||'Q')[0].toUpperCase();$('#app').innerHTML=({home,diagnostic,path,learn,trainers,project,portfolio,teacher}[page])()+footer();bind();}
function trackCards(){return tracks.map(t=>{const done=lessons.filter(l=>l.d===t.id&&state.completed.includes(l.id)).length;return `<article class="card track"><div class="row spread"><div class="tile">${t.icon}</div><span class="pill">3 сабақ</span></div><h3>${t.name}</h3><p>${t.desc}</p><div class="row spread micro"><span>Дайындық барысы</span><span>${done}/3 аяқталды</span></div><div class="progress"><span style="width:${done/3*100}%;background:${t.color}"></span></div><button class="btn" data-track="${t.id}">Бағытты ашу <span>↗</span></button></article>`}).join('')}
function home(){return intro(`Сәлем${state.profile.name?', '+esc(state.profile.name.split(' ')[0]):', жас зерттеуші'}! 👋`,'Үлкен жетістік өзіңді танудан басталады.')+`<section class="hero"><div class="hero-content"><div class="eyebrow">ҚАБІЛЕТІҢДІ ТАНЫ · БАҒЫТЫҢДЫ ТАП</div><h2>Информатикадан<br>өз жолыңды тап.</h2><p>Информатикадағы қабілетіңді зертте. Тренажерда шыңдал. Өз ғылыми жобаңа алғашқы қадам жаса.</p><button class="btn light" data-go="diagnostic">${latest()?'Қайта зерттеу':'Қабілетті зерттеуді бастау'} <span>→</span></button></div><div class="hero-art" aria-hidden="true"><div class="orbit"><div class="star">✦</div><i class="dot"></i><i class="dot two"></i></div><span class="art-tag">Мүмкіндігіңді аш</span></div></section><div class="card row spread" style="margin-top:20px"><div><h3>⌨ Информатика тренажерлары</h3><span class="muted sub">Кодты қадағалау, қатені түзету, алгоритм, екілік сандар, сұрыптау.</span></div><button class="btn primary" data-go="trainers">Жаттығуды бастау →</button></div><div class="stats"><div class="stat"><span class="stat-icon">◎</span><div><b>${state.history.length}</b><small>Аяқталған зерттеу</small></div></div><div class="stat"><span class="stat-icon">▤</span><div><b>${state.completed.length}<span style="font-size:14px;color:#94a18f"> / 9</span></b><small>Меңгерілген сабақ</small></div></div><div class="stat"><span class="stat-icon">✧</span><div><b>${state.project.title?1:0}</b><small>Портфолиодағы жоба</small></div></div></div><div class="section-row"><div><h2>Қай бағытта дамығың келеді?</h2><span class="muted sub">Алгоритмдер, Python және IT-зерттеу бойынша дамы.</span></div><button class="link-button" data-go="learn">Барлық сабақтар →</button></div><div class="grid3">${trackCards()}</div><div class="two-col"><section class="card"><span class="eyebrow">ҚАДАМДЫ БІРГЕ БАСТАЙЫҚ</span><h2 style="margin-top:8px">Сенің жолың қалай құрылады?</h2><div class="steps"><div class="step"><span class="step-num">01</span><div><b>Өзіңді таны</b><small>Қызығушылық пен 9 танымдық тапсырма</small></div></div><div class="step"><span class="step-num">02</span><div><b>Бағытыңды таңда</b><small>Нәтижеңе сай жеке дайындық ұсынысы</small></div></div><div class="step"><span class="step-num">03</span><div><b>Үйрен, зертте, нәтижені көр</b><small>Сабақтар, жоба және жетістік портфолиосы</small></div></div></div></section><section class="card" style="background:#f0f2e7"><div style="font-size:30px;margin-bottom:14px">✺</div><h2>Әр баланың<br>өзіндік қабілеті бар.</h2><p class="muted sub">Қысқа тапсырмалар — алғашқы бағдар. Қабілет туралы қорытынды мұғалім бақылауы, оқушы жұмыстары және уақыт ішіндегі дамуымен толықтырылады.</p><button class="link-button" data-go="teacher">Мұғалімге арналған бөлім →</button></section></div>`}
function diagnostic(){if(quiz)return quizView();return intro('Қабілетіңді зертте','Өзің туралы айтып, үш бағыттағы тапсырмаларды орында.')+`<div class="wide"><section class="card"><div class="row spread"><h2>Бірінші қадам — өзіңді таныстыру</h2><span class="pill">9 тапсырма · ≈ 10 минут</span></div><p class="muted sub">Бұл — бастапқы оқу диагностикасы. Нәтиже баланың дарындылығын түпкілікті анықтамайды.</p><form id="profile-form"><div class="form-grid"><label class="field">Атың немесе бүркеншік атың<input name="name" maxlength="50" required placeholder="Мысалы, Айару" value="${esc(state.profile.name)}" autocomplete="nickname"></label><label class="field">Сыныбың<select name="grade">${[5,6,7,8,9].map(n=>`<option ${state.profile.grade==n?'selected':''}>${n}</option>`).join('')}</select></label></div><label class="field">Қай әрекет саған көбірек ұнайды?<select name="interest">${tracks.map(t=>`<option value="${t.id}" ${state.profile.interest===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><div class="note">Жауапты асықпай таңда. Білмегеніңді белгілеу міндетті емес — «Әзірге білмеймін» батырмасын қолдана аласың. Сынып дерегі портфолиода көрсетіледі; бұл прототипте тапсырмалар 5–9-сыныптарға ортақ.</div><div class="row spread" style="margin-top:23px"><span class="micro">Аты-жөнің толық болуы міндетті емес.</span><button class="btn primary" type="submit">Тапсырмаларды бастау →</button></div></form></section></div>`}
function quizView(){const i=quiz.index,q=questions[i],selected=quiz.answers[i];return intro('Қабілетті зерттеу','Әр тапсырма — ойлау тәсіліңді байқауға мүмкіндік.')+`<div class="wide"><section class="card"><div class="row spread"><span class="pill">${tracks.find(t=>t.id===q.d).name}</span><span class="muted sub">${i+1} / ${questions.length} тапсырма</span></div><div class="progress"><span style="width:${(i+1)/questions.length*100}%"></span></div><h2 class="question-text">${esc(q.q)}</h2><div class="answers">${q.o.map((o,j)=>`<button class="answer ${selected===j?'selected':''}" data-answer="${j}" aria-pressed="${selected===j}"><span class="letter">${'ABCD'[j]}</span>${esc(o)}</button>`).join('')}</div><div class="row spread"><button class="btn" id="quiz-prev" ${i===0?'disabled':''}>← Алдыңғы</button><button class="link-button" id="quiz-skip">Әзірге білмеймін</button><button class="btn primary" id="quiz-next" ${selected===undefined?'disabled':''}>${i===8?'Нәтижені көру':'Келесі →'}</button></div><button class="back" id="quiz-cancel" style="margin:25px 0 0">Зерттеуді тоқтату</button></section></div>`}
function finishQuiz(){const r={id:String(Date.now()),date:new Date().toISOString(),scores:scores(quiz.answers),answers:quiz.answers};state.history.push(r);save();quiz=null;portfolioTab='results';go('portfolio');}

function openLesson(id){const l=lessons.find(x=>x.id===id);$('#lesson-body').innerHTML=`<div class="row spread"><span class="pill">${l.level} · ${l.minutes} минут</span><button class="btn" id="close-dialog" aria-label="Жабу">✕</button></div><h2 id="lesson-title" style="margin:20px 0">${l.title}</h2><p class="sub">${esc(l.text)}</p><div class="note" style="white-space:pre-line"><b>Мысал</b><br>${esc(l.example)}</div><h3 style="margin-top:23px">Өзіңді тексер</h3><p class="sub">${esc(l.q)}</p><div class="answers">${l.o.map((o,i)=>`<button class="answer" data-practice="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div><div id="practice-feedback" role="status"></div>`;$('#close-dialog').onclick=()=>$('#lessonDialog').close();$('#lessonDialog').showModal();document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.practice)===l.a;state.attempts[l.id]=(state.attempts[l.id]||0)+1;if(ok&&!state.completed.includes(l.id))state.completed.push(l.id);save();$('#practice-feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><b>${ok?'Дұрыс! Сабақ меңгерілді.':'Тағы ойланып көр.'}</b><br>${esc(ok?l.e:'Түсіндірме мен мысалды қайта қарап, жауабыңды таңда.')}</div>`;if(ok)document.querySelectorAll('[data-practice]').forEach(x=>x.disabled=true)});}

tion class="card"><span class="eyebrow">СОҢҒЫ ЗЕРТТЕУ · ${date(r.date)}</span><h2 style="margin-top:12px">${esc(state.profile.name)}, сенің қабілет картаң</h2>${bars(r)}<div class="note">Бұл пайыздар — осы қысқа тапсырмалардағы дұрыс жауап үлесі. Олар дарындылық пайызы немесе психологиялық диагноз емес. IT-зерттеу бағытының үш сұрағы зерттеушілік қабілетті толық бағаламайды.</div><button class="btn primary" style="margin-top:20px" data-go="path">Менің даму бағытым →</button></section><section class="card"><h2>Даму тарихы</h2><p class="muted sub">Қайта зерттеу бірдей тапсырмалармен өтеді. Өсуге жаттығу мен сұрақтарды есте сақтау да әсер етуі мүмкін.</p><div class="scroll"><table><thead><tr><th>Күні</th><th>Алгоритмдер</th><th>Python</th><th>IT-зерттеу</th></tr></thead><tbody>${state.history.slice().reverse().map(x=>`<tr><td>${date(x.date)}</td>${tracks.map(t=>`<td>${x.scores[t.id]}%</td>`).join('')}</tr>`).join('')}</tbody></table></div>${state.history.length>1?`<div class="note" style="margin-top:20px">Алғашқы нәтижемен айырмасы:<br>${tracks.map(t=>{const diff=r.scores[t.id]-state.history[0].scores[t.id];return `${t.short}: ${diff>0?'+':''}${diff} пайыздық тармақ`}).join('<br>')}</div>`:''}</section></div><section class="card" style="margin-top:20px"><h2>Жауаптарыңды талда</h2>${questions.map((q,i)=>`<details class="module"><summary class="sub">${r.answers[i]===q.a?'✓':'○'} ${i+1}. ${esc(q.q.split('\n')[0])}</summary><p class="sub" style="margin-top:12px">Сенің жауабың: ${r.answers[i]===null||r.answers[i]===undefined?'Әзірге білмеймін':esc(q.o[r.answers[i]])}<br>Дұрыс жауап: ${esc(q.o[q.a])}<br>${esc(q.e)}</p></details>`).join('')}</section>`)}

alue="${t.id}" ${state.directions[r.id]===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><button class="btn primary" id="save-note">Бақылау мен бағытты сақтау</button></section><section class="card"><h2>Оқушының соңғы нәтижесі</h2>${bars(r)}<p class="muted sub">Қысқа тесті жалғыз іріктеу құралы ретінде қолданбаңыз. Жұмыс үлгілерін, қызығушылығын және уақыт ішіндегі дамуын бірге қарастырыңыз.</p></section></div>`:''}<section class="card" style="margin-top:22px"><h3>Прототипті пайдалану</h3><p class="muted sub">Әр оқушы өз браузерінде жұмыс істейді. Нәтижесін портфолиодан жүктеп, мұғалімге бере алады. Деректер браузер тазаланса жоғалады.</p><div class="oneline"><button class="btn" id="export-json">Барлық деректі сақтау ↓</button><button class="btn" id="reset">Осы құрылғыдағы деректі өшіру</button></div></section>`}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const trainerTypes=[['trace','⌘','Python кодын қадағалау','Айнымалы мәнінің әр қадамда қалай өзгеретінін көр.'],['debug','⌕','Қатені түзет','Қате өрнекті дұрыстап, тесттермен тексер.'],['order','↳','Алгоритм құрастыр','Есеп шығару қадамдарын дұрыс ретке келтір.'],['binary','01','Екілік сандар','Екілік санды ондық жүйеге айналдыр.'],['sort','⇅','Сұрыптау зертханасы','Көршілерді салыстыр, ауыстыру мен салыстыру санын бақыла.']];
let activeTrainer='trace',traceStart=4,traceStep=0,binaryValue=13,orderValues=[2,0,3,1],debugTask=0,sortState=null;
const orderLabels=['a және b сандарын енгізу','s = a + b қосындысын есептеу','m = s / 2 орташа мәнін есептеу','m нәтижесін шығару'];
const bugs=[{code:'a = 4\nb = 8\nm = a + b / 2\nprint(m)',prompt:'Екі санның орташа мәні қате есептелді. m айнымалысына жазылатын өрнекті түзет.',placeholder:'m = ...',answer:'(a+b)/2',tests:'a = 4, b = 8 → 6; a = -2, b = 2 → 0; a = 5, b = 5 → 5.',hint:'Алдымен қосындыны есептеу үшін жақша қажет.'},{code:'n = 7\nif n / 2 == 0:\n    print("Жұп")\nelse:\n    print("Тақ")',prompt:'Санның жұптығын тексеретін шартты түзет. Тек шарт өрнегін жаз.',placeholder:'n ... 2 == 0',answer:'n%2==0',tests:'n = 0 → Жұп; n = 7 → Тақ; n = -4 → Жұп.',hint:'Бөлінді емес, қалдық қажет. Қалдық операторы — %.'},{code:'s = 0\nfor i in range(1, 5):\n    s += i\nprint(s)',prompt:'1-ден 5-ке дейінгі сандардың қосындысы 15 болуы керек. range бөлігін түзет.',placeholder:'range(...)',answer:'range(1,6)',tests:'Цикл мәндері: 1, 2, 3, 4, 5. Қосынды: 15.',hint:'range соңғы шекараны қоспайды. 5 саны кіруі үшін шекара қандай болуы керек?'}];
function awardTrainer(id){state.trainerScores=state.trainerScores||{};state.trainerScores[id]=true;save()}
function resetSort(){sortState={a:[7,3,9,2,5],i:0,j:0,count:0,swaps:0,done:false,message:'«Келесі салыстыру» батырмасын бас.'}}
function sortingStep(){const s=sortState;if(s.done)return;const a=s.a,j=s.j,swap=a[j]>a[j+1];s.message=`${a[j]} және ${a[j+1]} салыстырылды. ${swap?'Өсу реті бұзылған: орындары ауысты.':'Реті дұрыс: ауыстыру қажет емес.'}`;s.count++;if(swap){[a[j],a[j+1]]=[a[j+1],a[j]];s.swaps++}s.j++;if(s.j>=a.length-1-s.i){s.j=0;s.i++}if(s.i>=a.length-1){s.done=true;s.message+=' Сұрыптау аяқталды!';awardTrainer('sort-complete')}}
function trainers(){if(!sortState)resetSort();const total=Object.keys(state.trainerScores||{}).length;return intro('Информатика тренажерлары','Қабілетіңді тәжірибеде шыңда: орында, тексер, қатені талда.')+`<div class="grid3" style="margin-bottom:24px">${trainerTypes.map(([id,icon,title,desc])=>`<button class="card" data-trainer="${id}" style="text-align:left;color:var(--ink);${activeTrainer===id?'border:2px solid var(--green);background:#eef4ed':''}"><span class="eyebrow">${icon} · ИНФОРМАТИКА</span><h3 style="margin:10px 0">${title}</h3><span class="muted sub">${desc}</span></button>`).join('')}</div><section class="card"><div class="row spread"><div><span class="eyebrow">ПРАКТИКАЛЫҚ ЖАТТЫҒУ</span><h2 style="margin-top:8px">${trainerTypes.find(t=>t[0]===activeTrainer)[2]}</h2></div><span class="pill">${total} орындалған жаттығу</span></div>${trainerBody()}</section><div class="two-col"><div class="note"><b>Ғылыми жобаға көпір</b><p style="margin-top:8px">Сұрыптау зертханасында салыстыру мен ауыстыру санын бақыла. Прототипті дамытып, әртүрлі ұзындықтағы және реттегі тізімдерді салыстыратын ғылыми жоба жасай аласың.</p><button class="link-button" data-go="project">Зерттеу жоспарын жазу →</button></div><div class="note"><b>Орындалған жаттығулар</b><p style="margin-top:8px">Сәтті аяқталған жаттығулар осы браузердегі портфолиоға сақталады. Бұл бөлім кодты талдауға арналған; еркін Python программасын іске қоспайды.</p><button class="link-button" data-go="portfolio">Портфолионы ашу →</button></div></div>`}
function trainerBody(){if(activeTrainer==='trace'){const x=traceStart,values=[x,x+3,(x+3)*2],lines=[`x = ${x}`,'x = x + 3','x = x * 2','print(x)'];return `<p class="muted sub">Кодты орындамай тұрып нәтижені болжа. Кейін әр қадамды ашып, болжамыңды салыстыр.</p><div class="two-col"><div><label class="field">Бастапқы x (0–20)<input type="number" id="trace-start" min="0" max="20" value="${x}"></label><div style="background:#18342e;border-radius:10px;padding:18px;color:#edf4e8;font-family:monospace">${lines.map((line,i)=>`<div style="padding:7px;${i===traceStep-1?'background:#41684b;border-radius:5px;':''}"><span style="color:#91a99a;margin-right:15px">${i+1}</span>${esc(line)}</div>`).join('')}</div></div><div><div class="note"><b>Айнымалы күйі</b><p style="margin-top:8px;font-size:24px">x = ${traceStep?values[Math.min(traceStep-1,2)]:'—'}</p><span>Экран: ${traceStep===4?values[2]:'әзірге бос'}</span></div><form id="trace-form" style="margin-top:20px"><label class="field">Экранға қандай сан шығады?<input id="trace-prediction" type="number" required placeholder="Өз болжамыңды жаз"></label><button class="btn primary">Болжамды тексер</button></form><div id="trainer-feedback" role="status"></div></div></div><div class="oneline" style="margin-top:20px"><button class="btn" id="trace-reset">Қайта бастау</button><button class="btn primary" id="trace-next" ${traceStep===4?'disabled':''}>Келесі қадам →</button><span class="micro" style="align-self:center">${traceStep}/4 қадам</span></div>`}
if(activeTrainer==='debug'){const b=bugs[debugTask];return `<div class="oneline" style="margin:15px 0">${bugs.map((_,i)=>`<button class="btn ${debugTask===i?'primary':''}" data-debug-task="${i}">${i+1}-қате</button>`).join('')}</div><div class="two-col"><div><pre style="white-space:pre-wrap;background:#18342e;color:#edf4e8;border-radius:10px;padding:20px">${esc(b.code)}</pre><p class="sub">${b.prompt}</p></div><div><form id="debug-form"><label class="field">Түзетілген өрнек<input id="debug-answer" required placeholder="${b.placeholder}" maxlength="100" autocomplete="off" spellcheck="false"></label><button class="btn primary">Тексеру</button></form><details class="note" style="margin-top:15px"><summary>Көмек</summary>${b.hint}</details><div id="trainer-feedback" role="status"></div></div></div>`}
if(activeTrainer==='order'){return `<p class="muted sub">Екі санның орташа мәнін табу алгоритмін ретте. ↑ және ↓ батырмаларын қолдан.</p><div class="path-list">${orderValues.map((v,i)=>`<div class="path-item"><span class="step-num">${i+1}</span><b class="sub" style="flex:1">${orderLabels[v]}</b><button class="btn" data-move="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="Қадамды жоғары жылжыту">↑</button><button class="btn" data-move="${i}" data-dir="1" ${i===3?'disabled':''} aria-label="Қадамды төмен жылжыту">↓</button></div>`).join('')}</div><button class="btn primary" style="margin-top:20px" id="order-check">Ретін тексеру</button><div id="trainer-feedback" role="status"></div>`}
if(activeTrainer==='binary')return `<div class="two-col"><div><p class="sub">Екілік санды ондық жүйеге айналдыр.</p><div style="font-size:46px;letter-spacing:8px;color:var(--green);margin:20px 0">${binaryValue.toString(2)}<sub style="font-size:17px;letter-spacing:0">2</sub></div><details class="note"><summary>Разрядтарды еске түсіру</summary>Оңнан солға: 1, 2, 4, 8, 16, 32. «1» тұрған разрядтардың салмақтарын қос.</details></div><div><form id="binary-form"><label class="field">Ондық жүйедегі мәні<input id="binary-answer" type="number" required min="0" max="63" placeholder="Жауабыңды енгіз"></label><button class="btn primary">Жауапты тексеру</button></form><button class="btn" style="margin-top:15px" id="binary-new">Басқа сан ↻</button><div id="trainer-feedback" role="status"></div></div></div>`;
const s=sortState;return `<p class="muted sub">Өсу ретімен сұрыптау. Әр басқанда бір жұп салыстырылады. Соңғы реттелген бөлік жасылмен белгіленеді.</p><div class="row" style="gap:10px;flex-wrap:wrap;margin:25px 0">${s.a.map((n,i)=>`<div style="width:58px;text-align:center"><div style="height:${50+n*8}px;background:${s.done||i>=s.a.length-s.i?'#477954':i===s.j||i===s.j+1?'#e7b679':'#d9e1d9'};border-radius:7px 7px 0 0"></div><b>${n}</b></div>`).join('')}</div><div class="oneline"><span class="pill">Салыстыру: ${s.count}</span><span class="pill">Ауыстыру: ${s.swaps}</span><span class="pill">Өту: ${Math.min(s.i+1,4)} / 4</span></div><div class="note" style="margin-top:20px" role="status">${esc(s.message)}</div><div class="oneline" style="margin-top:20px"><button class="btn primary" id="sort-next" ${s.done?'disabled':''}>Келесі салыстыру →</button><button class="btn" id="sort-reset">Қайта бастау</button></div><p class="micro" style="margin-top:15px">Бұл нұсқа ерте тоқтау оңтайландыруын қолданбайды: 5 элементке 10 салыстыру жасайды.</p>`}
function feedback(ok,text){$('#trainer-feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><b>${ok?'Дұрыс!':'Тағы байқап көр.'}</b><br>${esc(text)}</div>`}
function normalizeCode(v){return v.replace(/\s/g,'').replace(/^(m=|if)/,'').replace(/:$/,'')}
function bindTrainers(){document.querySelectorAll('[data-trainer]').forEach(b=>b.onclick=()=>{activeTrainer=b.dataset.trainer;render()});if(page!=='trainers')return;
if($('#trace-next')){$('#trace-next').onclick=()=>{traceStep=Math.min(4,traceStep+1);render()};$('#trace-reset').onclick=()=>{traceStep=0;render()};$('#trace-start').onchange=()=>{const n=Number($('#trace-start').value);traceStart=Number.isFinite(n)?Math.max(0,Math.min(20,Math.round(n))):4;traceStep=0;render()};$('#trace-form').onsubmit=e=>{e.preventDefault();const ok=Number($('#trace-prediction').value)===(traceStart+3)*2;if(ok)awardTrainer('trace-'+traceStart);feedback(ok,ok?'Болжамың код нәтижесімен сәйкес келді. Қадамдап талдауды да орында.':'Алдымен бастапқы мәнге 3 қосылады, кейін 2-ге көбейтіледі.')}}
document.querySelectorAll('[data-debug-task]').forEach(b=>b.onclick=()=>{debugTask=Number(b.dataset.debugTask);render()});if($('#debug-form'))$('#debug-form').onsubmit=e=>{e.preventDefault();const b=bugs[debugTask],ok=normalizeCode($('#debug-answer').value)===b.answer;if(ok)awardTrainer('debug-'+debugTask);feedback(ok,ok?'Дұрыс өрнек. Тексеру мысалдары: '+b.tests:b.hint)};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.move),j=i+Number(b.dataset.dir);if(j<0||j>=orderValues.length)return;[orderValues[i],orderValues[j]]=[orderValues[j],orderValues[i]];render()});if($('#order-check'))$('#order-check').onclick=()=>{const ok=orderValues.every((v,i)=>v===i);if(ok)awardTrainer('order-average');feedback(ok,ok?'Кіріс → қосынды → орташа мән → нәтиже. Алгоритм дайын!':'Алдымен деректер енгізіледі. Әр есептеу өзіне қажет алдыңғы мән дайын болғанда орындалады.')};
if($('#binary-form')){$('#binary-form').onsubmit=e=>{e.preventDefault();const ok=Number($('#binary-answer').value)===binaryValue;if(ok)awardTrainer('binary-'+binaryValue);feedback(ok,ok?binaryValue.toString(2)+'₂ = '+binaryValue+'₁₀. Разрядтардың салмақтарын дұрыс қостың.':'«1» тұрған разрядтардың салмақтарын қос. Оң жақтан: 1, 2, 4, 8, 16, 32.')};$('#binary-new').onclick=()=>{binaryValue=binaryValue%31+1;render()}}if($('#sort-next')){$('#sort-next').onclick=()=>{sortingStep();render()};$('#sort-reset').onclick=()=>{resetSort();render()}}}

function bind(){bindTrainers();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{trackFilter=b.dataset.track;go('learn')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{trackFilter=b.dataset.filter;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{portfolioTab=b.dataset.tab;render()});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));
const f=$('#profile-form');if(f)f.onsubmit=e=>{e.preventDefault();const data=new FormData(f),name=data.get('name').trim();if(!name){toast('Атыңды енгіз.');return}state.profile={name,grade:data.get('grade'),interest:data.get('interest')};if(!save())return;quiz={index:0,answers:[]};render()};
if(quiz&&page==='diagnostic'){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{quiz.answers[quiz.index]=Number(b.dataset.answer);render()});$('#quiz-prev').onclick=()=>{if(quiz.index>0){quiz.index--;render()}};$('#quiz-next').onclick=()=>{if(quiz.answers[quiz.index]===undefined)return;if(quiz.index===8)finishQuiz();else{quiz.index++;render()}};$('#quiz-skip').onclick=()=>{quiz.answers[quiz.index]=null;if(quiz.index===8)finishQuiz();else{quiz.index++;render()}};$('#quiz-cancel').onclick=()=>{if(confirm('Аяқталмаған зерттеуді тоқтатасың ба? Жауаптар сақталмайды.')){quiz=null;render()}};}
const pf=$('#project-form');if(pf){pf.oninput=()=>{for(const [k]of projectFields)state.project[k]=pf.elements[k].value;const ok=save();$('#project-save').textContent=ok?'✓ Өзгерістер сақталды':''};pf.onsubmit=e=>{e.preventDefault();pf.dispatchEvent(new Event('input'));toast('Жоба сақталды. Портфолиодан көре аласың.')};$('#export-project').onclick=()=>download('QabiletLab_zhoba.txt',projectFields.map(([k,l])=>`${l}\n${state.project[k]||'—'}`).join('\n\n'));}
document.querySelectorAll('[data-project-idea]').forEach(b=>b.onclick=()=>{if(state.project.title&&!confirm('Қазіргі жоба атауы мен сұрағын ауыстырасыз ба? Басқа жазбалар сақталады.'))return;const ideas=[['Сұрыптау алгоритмдерінің тиімділігі','Тізім ұзындығы сұрыптау алгоритмдерінің салыстыру санына қалай әсер етеді?'],['Оқу жоспарына арналған веб-құрал','Оқу тапсырмаларын еске салатын веб-құрал жоспарланған жұмыстың орындалуына қалай әсер етеді?'],['Күмәнді сілтемені тану тренажері','Тренажермен жаттығу күмәнді сілтемелерді тану дәлдігіне қалай әсер етеді?']];[state.project.title,state.project.question]=ideas[Number(b.dataset.projectIdea)];save();render();toast('Идея қосылды. Енді өз болжамыңды жаз.')});
if($('#save-note'))$('#save-note').onclick=()=>{state.notes[latest().id]=$('#teacher-note').value;state.directions[latest().id]=$('#teacher-direction').value;if(save())toast('Бақылау мен дайындық бағыты сақталды.')};
if($('#export-json'))$('#export-json').onclick=()=>download('QabiletLab_portfolio.json',JSON.stringify(state,null,2),'application/json');
if($('#export-csv'))$('#export-csv').onclick=()=>{const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Оқушы','Сынып','Күні','Алгоритмдер %','Python %','IT-зерттеу %','Меңгерілген сабақтар','Бақылау'],...state.history.map(r=>[state.profile.name,state.profile.grade,date(r.date),...tracks.map(t=>r.scores[t.id]),state.completed.length,state.notes[r.id]||''])];download('QabiletLab_esep.csv','\uFEFF'+rows.map(row=>row.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')};
if($('#print'))$('#print').onclick=()=>window.print();if($('#reset'))$('#reset').onclick=()=>{if(confirm('Осы браузердегі барлық нәтиже, жоба және жазбалар жойылады. Алдымен деректі жүктеп алдыңыз ба?')){const previous=state;state=blank();if(save()){quiz=null;render();toast('Деректер өшірілді.')}else state=previous}};
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
