{d:'logic',q:'Қатардағы келесі санды тап: 3, 7, 15, 31, …',o:['47','62','63','65'],a:2,e:'Әр санды 2-ге көбейтіп, 1 қосамыз: 31 × 2 + 1 = 63.'},
{d:'logic',q:'Аружан Бекзаттан биік. Бекзат Даниярдан биік. Кімнің бойы ең биік?',o:['Данияр','Аружан','Бекзат','Анықтау мүмкін емес'],a:1,e:'Аружан > Бекзат > Данияр. Сондықтан ең биігі — Аружан.'},
{d:'logic',q:'Үш дәптер 450 теңге тұрады. Осындай бес дәптер қанша тұрады?',o:['600 теңге','700 теңге','750 теңге','900 теңге'],a:2,e:'Бір дәптер: 450 ÷ 3 = 150 теңге. Бесеуі: 150 × 5 = 750 теңге.'},

{d:'research',q:'«Жарық өсімдіктің өсуіне әсер ете ме?» деген сұрақты қалай тексерген дұрыс?',o:['Бір өсімдікті бақылаусыз қалдыру','Бірдей екі өсімдікті әртүрлі жарықта, қалған жағдайын бірдей ұстап өсіру','Әртүрлі өсімдіктерге әртүрлі су беру','Достардың пікірін ғана сұрау'],a:1,e:'Жарықтың әсерін тексеру үшін су, топырақ және өсімдік түрі бірдей болуы керек.'},
{d:'research',q:'Қайсысы тексеруге болатын болжам?',o:['Көк түс ең әдемі','Барлық идея керемет','Күніне 10 минут жаттығу есеп шешу уақытын қысқартуы мүмкін','Математика қызықсыз'],a:2,e:'Жаттығуға дейінгі және кейінгі уақытты өлшеп, болжамды тексеруге болады.'},

{id:'l1',d:'logic',level:'Бастапқы',title:'Сандық заңдылықтар',minutes:8,text:'Қатарды зерттегенде көршілес сандардың айырмасын салыстыр. Айырма тұрақты болмаса, көбейту немесе екі әрекетті біріктіру тәсілін тексер.',example:'2, 5, 8, 11 → әр қадамда 3 қосылады. Келесі сан — 14.',q:'5, 9, 13, 17, … Келесі сан?',o:['19','20','21','22'],a:2,e:'Айырма 4: 17 + 4 = 21.'},
{id:'l2',d:'logic',level:'Орта',title:'Логикалық қорытынды',minutes:10,text:'Берілген шарт пен өз жорамалыңды ажырат. Барлық элементке қатысты шартты бір элементке қолдануға болады, бірақ кері қорытынды әрдайым дұрыс емес.',example:'Барлық шаршы — тіктөртбұрыш. Бірақ барлық тіктөртбұрыш шаршы бола бермейді.',q:'Барлық роботта сенсор бар. А нысанында сенсор бар. А міндетті түрде робот па?',o:['Иә, міндетті түрде','Жоқ, дерек жеткіліксіз','Сенсоры бар зат жоқ','Барлық сенсор — робот'],a:1,e:'Сенсор басқа құрылғыларда да болуы мүмкін. Шарттан кері қорытынды жасауға болмайды.'},
{id:'l3',d:'logic',level:'Күрделі',title:'Есепті кері шешу',minutes:12,text:'Нәтиже белгілі болса, соңғы әрекеттен баста. Қосу үшін азайтуды, көбейту үшін бөлуді кері амал ретінде қолдан.',example:'Белгісіз санды 3-ке көбейтіп, 6 қосты. 21 шықты. (21 − 6) ÷ 3 = 5.',q:'Бір санды 2-ге көбейтіп, 8 қосты. 30 шықты. Бастапқы сан?',o:['11','15','19','22'],a:0,e:'(30 − 8) ÷ 2 = 11. Тексеру: 11 × 2 + 8 = 30.'},
{id:'c1',d:'code',level:'Бастапқы',title:'Алгоритм және қадамдар',minutes:8,text:'Алгоритм — мақсатқа жеткізетін нақты қадамдар реті. Әр қадам түсінікті болуы және келесі әрекетті анықтауы керек.',example:'Екі санның қосындысы: a санын енгіз → b санын енгіз → s = a + b → s мәнін көрсет.',q:'a = 6; b = 4; a = a + b. Соңында a нешеге тең?',o:['4','6','10','24'],a:2,e:'a айнымалысына 6 + 4 нәтижесі, яғни 10 жазылады.'},
{id:'c2',d:'code',level:'Орта',title:'Шартты тексеру',minutes:10,text:'if шарты ақиқат болса, сол тармақ орындалады. Жалған болса, else тармағы орындалады. Python-да == салыстырады, ал = мән меншіктейді.',example:'n = 7\nif n % 2 == 0:\n    print("Жұп")\nelse:\n    print("Тақ")\nНәтиже: Тақ.',q:'n = 12 болса, n % 2 == 0 шартының мәні қандай?',o:['Ақиқат','Жалған','12','Қате'],a:0,e:'12-ні 2-ге бөлгендегі қалдық 0. Шарт ақиқат.'},
{id:'c3',d:'code',level:'Күрделі',title:'Циклмен қосынды табу',minutes:12,text:'Қайталау бір әрекетті бірнеше рет орындайды. Қосындыны жинау үшін айнымалыны циклге дейін нөлге теңестіреміз.',example:'s = 0\nfor i in range(1, 4):\n    s = s + i\nprint(s)\nНәтиже: 1 + 2 + 3 = 6.',q:'s = 0; циклде 2, 4, 6 сандары s-ке кезекпен қосылды. Соңғы s?',o:['6','8','10','12'],a:3,e:'0 + 2 + 4 + 6 = 12.'},
{id:'r1',d:'research',level:'Бастапқы',title:'Зерттеу сұрағын қою',minutes:8,text:'Жақсы зерттеу сұрағы нақты, қауіпсіз және қолда бар құралмен тексерілетін болады. «Қайсысы жақсы?» деудің орнына өлшенетін көрсеткіш таңда.',example:'«Қағаз ұшақтың қанат ені оның ұшу қашықтығына қалай әсер етеді?» Қашықтықты метрмен өлшеуге болады.',q:'Қай сұрақты мектеп жағдайында өлшеп тексеруге болады?',o:['Әлемдегі ең жақсы түс қандай?','Қанат ені қағаз ұшақтың ұшу қашықтығына қалай әсер етеді?','Барлық адам нені ойлайды?','Ең керемет пән қандай?'],a:1,e:'Қанат енін өзгертіп, ұшу қашықтығын өлшеуге болады.'},
{id:'r2',d:'research',level:'Орта',title:'Әділ тәжірибе',minutes:10,text:'Бір фактордың әсерін зерттегенде басқа жағдайларды тұрақты ұста. Нәтижені бірнеше рет өлше. Қауіпсіздік ережесін мұғаліммен бірге қарастыр.',example:'Қанат енін салыстырғанда қағаз түрі, ұшыру орны және ұшыру тәсілі бірдей болады. Әр нұсқа 3 рет сыналады.',q:'Қағаз түрінің әсерін тексергенде нені өзгерту керек?',o:['Қағаз түрін ғана','Қағаз бен қанат енін бірге','Ұшыру орнын әр жолы','Барлық жағдайды'],a:0,e:'Бір факторды өзгерту оның әсерін бөлек бағалауға көмектеседі.'},
{id:'r3',d:'research',level:'Күрделі',title:'Деректен қорытынды шығару',minutes:12,text:'Қорытынды нақты дерекке сүйенеді. Орташа мәнді есептеп, салыстыр. Нәтиженің қай жағдайда алынғанын және шектеулерін ата.',example:'А нұсқасы: 3, 4, 5 м → орташа 4 м. Б нұсқасы: 5, 6, 7 м → орташа 6 м. Осы сынақта Б 2 м алыс ұшты.',q:'Үш сынақтағы қашықтық: 2, 4, 6 метр. Орташа қашықтық?',o:['3 м','4 м','6 м','12 м'],a:1,e:'(2 + 4 + 6) ÷ 3 = 4 метр.'}
];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('Сақтау мүмкін болмады. Браузердің сақтау рұқсатын тексеріңіз.');return false}}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function latest(){return state.history.at(-1)}
function scores(answers){return Object.fromEntries(tracks.map(t=>[t.id,Math.round(questions.reduce((s,q,i)=>s+(q.d===t.id&&answers[i]===q.a?1:0),0)/3*100)]))}
function recommended(){const r=latest();if(!r)return state.profile.interest||'logic';return tracks.slice().sort((a,b)=>r.scores[b.id]-r.scores[a.id]||(a.id===state.profile.interest?-1:1))[0].id}
function footer(){return '<footer><span>© 2026 QabiletLab · Әр оқушының мүмкіндігін ашамыз</span><span>Прототип · Деректер осы браузерде сақталады</span></footer>'}
function intro(title,desc,tag='ОҚУШЫ КЕҢІСТІГІ'){return `<div class="intro"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><p class="muted sub">${desc}</p></div><span class="badge">Жеке даму жолы</span></div>`}
function go(p){location.hash=p}
function render(){page=location.hash.slice(1)||'home';if(!['home','diagnostic','path','learn','project','portfolio','teacher'].includes(page))page='home';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=document.querySelector(`nav button[data-page="${page}"]`).textContent.trim();$('#header-name').textContent=state.profile.name||'Жас зерттеуші';$('#header-grade').textContent=state.profile.name?`${state.profile.grade}-сынып оқушысы`:'Өз жолыңды бүгін баста';$('#avatar').textContent=(state.profile.name||'Q')[0].toUpperCase();$('#app').innerHTML=({home,diagnostic,path,learn,project,portfolio,teacher}[page])()+footer();bind();}
function trackCards(){return tracks.map(t=>{const done=lessons.filter(l=>l.d===t.id&&state.completed.includes(l.id)).length;return `<article class="card track"><div class="row spread"><div class="tile">${t.icon}</div><span class="pill">3 сабақ</span></div><h3>${t.name}</h3><p>${t.desc}</p><div class="row spread micro"><span>Дайындық барысы</span><span>${done}/3 аяқталды</span></div><div class="progress"><span style="width:${done/3*100}%;background:${t.color}"></span></div><button class="btn" data-track="${t.id}">Бағытты ашу <span>↗</span></button></article>`}).join('')}
function home(){return intro(`Сәлем${state.profile.name?', '+esc(state.profile.name.split(' ')[0]):', жас зерттеуші'}! 👋`,'Үлкен жетістік өзіңді танудан басталады.')+`<section class="hero"><div class="hero-content"><div class="eyebrow">ҚАБІЛЕТІҢДІ ТАНЫ · БАҒЫТЫҢДЫ ТАП</div><h2>Сенің қабілетің.<br>Сенің даму жолың.</h2><p>Өзіңді жаңа қырынан танып, қызығушылығыңа сай тапсырмалармен алға жылжы.</p><button class="btn light" data-go="diagnostic">${latest()?'Қайта зерттеу':'Қабілетті зерттеуді бастау'} <span>→</span></button></div><div class="hero-art" aria-hidden="true"><div class="orbit"><div class="star">✦</div><i class="dot"></i><i class="dot two"></i></div><span class="art-tag">Мүмкіндігіңді аш</span></div></section><div class="stats"><div class="stat"><span class="stat-icon">◎</span><div><b>${state.history.length}</b><small>Аяқталған зерттеу</small></div></div><div class="stat"><span class="stat-icon">▤</span><div><b>${state.completed.length}<span style="font-size:14px;color:#94a18f"> / 9</span></b><small>Меңгерілген сабақ</small></div></div><div class="stat"><span class="stat-icon">✧</span><div><b>${state.project.title?1:0}</b><small>Портфолиодағы жоба</small></div></div></div><div class="section-row"><div><h2>Қай бағытта дамығың келеді?</h2><span class="muted sub">Қызығушылығыңды зертте, жаңа мүмкіндікті байқап көр.</span></div><button class="link-button" data-go="learn">Барлық сабақтар →</button></div><div class="grid3">${trackCards()}</div><div class="two-col"><section class="card"><span class="eyebrow">ҚАДАМДЫ БІРГЕ БАСТАЙЫҚ</span><h2 style="margin-top:8px">Сенің жолың қалай құрылады?</h2><div class="steps"><div class="step"><span class="step-num">01</span><div><b>Өзіңді таны</b><small>Қызығушылық пен 9 танымдық тапсырма</small></div></div><div class="step"><span class="step-num">02</span><div><b>Бағытыңды таңда</b><small>Нәтижеңе сай жеке дайындық ұсынысы</small></div></div><div class="step"><span class="step-num">03</span><div><b>Үйрен, зертте, нәтижені көр</b><small>Сабақтар, жоба және жетістік портфолиосы</small></div></div></div></section><section class="card" style="background:#f0f2e7"><div style="font-size:30px;margin-bottom:14px">✺</div><h2>Әр баланың<br>өзіндік қабілеті бар.</h2><p class="muted sub">Қысқа тапсырмалар — алғашқы бағдар. Қабілет туралы қорытынды мұғалім бақылауы, оқушы жұмыстары және уақыт ішіндегі дамуымен толықтырылады.</p><button class="link-button" data-go="teacher">Мұғалімге арналған бөлім →</button></section></div>`}
function diagnostic(){if(quiz)return quizView();return intro('Қабілетіңді зертте','Өзің туралы айтып, үш бағыттағы тапсырмаларды орында.')+`<div class="wide"><section class="card"><div class="row spread"><h2>Бірінші қадам — өзіңді таныстыру</h2><span class="pill">9 тапсырма · ≈ 10 минут</span></div><p class="muted sub">Бұл — бастапқы оқу диагностикасы. Нәтиже баланың дарындылығын түпкілікті анықтамайды.</p><form id="profile-form"><div class="form-grid"><label class="field">Атың немесе бүркеншік атың<input name="name" maxlength="50" required placeholder="Мысалы, Айару" value="${esc(state.profile.name)}" autocomplete="nickname"></label><label class="field">Сыныбың<select name="grade">${[5,6,7,8,9].map(n=>`<option ${state.profile.grade==n?'selected':''}>${n}</option>`).join('')}</select></label></div><label class="field">Қай әрекет саған көбірек ұнайды?<select name="interest">${tracks.map(t=>`<option value="${t.id}" ${state.profile.interest===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><div class="note">Жауапты асықпай таңда. Білмегеніңді белгілеу міндетті емес — «Әзірге білмеймін» батырмасын қолдана аласың. Сынып дерегі портфолиода көрсетіледі; бұл прототипте тапсырмалар 5–9-сыныптарға ортақ.</div><div class="row spread" style="margin-top:23px"><span class="micro">Аты-жөнің толық болуы міндетті емес.</span><button class="btn primary" type="submit">Тапсырмаларды бастау →</button></div></form></section></div>`}
function quizView(){const i=quiz.index,q=questions[i],selected=quiz.answers[i];return intro('Қабілетті зерттеу','Әр тапсырма — ойлау тәсіліңді байқауға мүмкіндік.')+`<div class="wide"><section class="card"><div class="row spread"><span class="pill">${tracks.find(t=>t.id===q.d).name}</span><span class="muted sub">${i+1} / ${questions.length} тапсырма</span></div><div class="progress"><span style="width:${(i+1)/questions.length*100}%"></span></div><h2 class="question-text">${esc(q.q)}</h2><div class="answers">${q.o.map((o,j)=>`<button class="answer ${selected===j?'selected':''}" data-answer="${j}" aria-pressed="${selected===j}"><span class="letter">${'ABCD'[j]}</span>${esc(o)}</button>`).join('')}</div><div class="row spread"><button class="btn" id="quiz-prev" ${i===0?'disabled':''}>← Алдыңғы</button><button class="link-button" id="quiz-skip">Әзірге білмеймін</button><button class="btn primary" id="quiz-next" ${selected===undefined?'disabled':''}>${i===8?'Нәтижені көру':'Келесі →'}</button></div><button class="back" id="quiz-cancel" style="margin:25px 0 0">Зерттеуді тоқтату</button></section></div>`}
function finishQuiz(){const r={id:String(Date.now()),date:new Date().toISOString(),scores:scores(quiz.answers),answers:quiz.answers};state.history.push(r);save();quiz=null;portfolioTab='results';go('portfolio');}
function bars(r){return `<div class="bars">${tracks.map(t=>`<div><div class="bar-label"><span>${t.name}</span><b>${r.scores[t.id]}%</b></div><div class="progress"><span style="width:${r.scores[t.id]}%;background:${t.color}"></span></div><div class="micro">${Math.round(r.scores[t.id]*3/100)} / 3 дұрыс жауап</div></div>`).join('')}</div>`}
function path(){const id=recommended(),t=tracks.find(x=>x.id===id),r=latest(),manual=r&&state.directions[r.id];return intro('Менің жеке даму бағытым','Шағын қадамдардан тұрақты жетістікке.')+(!r?`<div class="note">Алдымен қабілетті зерттеуден өтсең, тапсырма нәтижесіне сай ұсыныс аласың. Қазір өз қызығушылығыңа сай бағыт көрсетілген. <button class="link-button" data-go="diagnostic">Зерттеуді бастау →</button></div>`:'')+`<div class="two-col"><section><div class="card"><span class="eyebrow">${manual?'МҰҒАЛІМ БЕЛГІЛЕГЕН БАҒЫТ':'БАСТАПҚЫ ҰСЫНЫС'}</span><h2 style="margin-top:12px">${tracks.find(x=>x.id===(manual||id)).name}</h2><p class="muted sub">${manual?'Мұғалім бұл бағытты бақылау мен жұмыс нәтижесіне сүйеніп белгіледі.':'Ұсыныс үш бағыттағы дұрыс жауап санына сүйенеді. Нәтиже тең болса, таңдаған қызығушылығың ескеріледі.'}</p><span class="pill">Өз қарқыныңмен үйрен</span></div><div class="path-list">${lessons.filter(l=>l.d===(manual||id)).map((l,i)=>`<div class="path-item"><span class="step-num">${state.completed.includes(l.id)?'✓':i+1}</span><div><b>${l.title}</b><div class="micro">${l.level} · ${l.minutes} минут</div></div><button class="btn" data-lesson="${l.id}">${state.completed.includes(l.id)?'Қайталау':'Бастау →'}</button></div>`).join('')}<div class="path-item"><span class="step-num">4</span><div><b>Идеяңды жобаға айналдыр</b><div class="micro">Сұрақ → болжам → әдіс → дерек</div></div><button class="btn" data-go="project">Жоба құру →</button></div></div></section><aside class="card" style="align-self:start"><h3>Қабілет картасы</h3>${r?bars(r):'<p class="muted sub">Алғашқы зерттеуден кейін картаң осы жерде пайда болады.</p>'}<div class="note">Бір бағытпен шектелме. Қалған бағыттардың тапсырмаларын да орындап көр.</div><button class="btn" style="width:100%;margin-top:15px" data-go="learn">Барлық бағытты көру</button></aside></div>`}
function learn(){return intro('Дайындық орталығы','Түсін → мысалды қара → өзің орында → кері байланыс ал.')+`<div class="oneline" style="margin-bottom:23px"><button class="btn ${trackFilter==='all'?'primary':''}" data-filter="all">Барлық бағыт</button>${tracks.map(t=>`<button class="btn ${trackFilter===t.id?'primary':''}" data-filter="${t.id}">${t.short}</button>`).join('')}</div><div class="grid3">${lessons.filter(l=>trackFilter==='all'||l.d===trackFilter).map(l=>`<article class="card"><div class="row spread"><span class="pill">${l.level}</span><span class="micro">${l.minutes} мин</span></div><div class="micro" style="margin-top:22px">${tracks.find(t=>t.id===l.d).name}</div><h3 style="margin:7px 0 15px">${l.title}</h3><p class="muted sub">${esc(l.text.slice(0,100))}…</p><div class="row spread"><span class="micro">${state.completed.includes(l.id)?'✓ Меңгерілді':'Түсіндірме + тапсырма'}</span><button class="btn" data-lesson="${l.id}">${state.completed.includes(l.id)?'Қайталау':'Оқу →'}</button></div></article>`).join('')}</div>`}

if($('#export-json'))$('#export-json').onclick=()=>download('QabiletLab_portfolio.json',JSON.stringify(state,null,2),'application/json');
if($('#export-csv'))$('#export-csv').onclick=()=>{const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Оқушы','Сынып','Күні','Логика %','Алгоритм %','Зерттеу %','Меңгерілген сабақтар','Бақылау'],...state.history.map(r=>[state.profile.name,state.profile.grade,date(r.date),...tracks.map(t=>r.scores[t.id]),state.completed.length,state.notes[r.id]||''])];download('QabiletLab_esep.csv','\uFEFF'+rows.map(row=>row.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')};
if($('#print'))$('#print').onclick=()=>window.print();if($('#reset'))$('#reset').onclick=()=>{if(confirm('Осы браузердегі барлық нәтиже, жоба және жазбалар жойылады. Алдымен деректі жүктеп алдыңыз ба?')){const previous=state;state=blank();if(save()){quiz=null;render();toast('Деректер өшірілді.')}else state=previous}};
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
